<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FitFuel × HyperFrames Prototype</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07111d;color:#f5f8ff;font-family:Inter,Arial,sans-serif}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#15324b 0%,#07111d 58%,#03070d 100%)}
.grid{position:absolute;inset:0;opacity:.13;background-image:linear-gradient(#6ea4c8 1px,transparent 1px),linear-gradient(90deg,#6ea4c8 1px,transparent 1px);background-size:72px 72px}
.brand{position:absolute;left:90px;top:95px;font-size:28px;letter-spacing:7px;color:#72e6c2;font-weight:800}
.kicker{position:absolute;left:90px;top:330px;font-size:26px;letter-spacing:5px;color:#72e6c2;font-weight:700}
h1{position:absolute;left:90px;right:90px;top:390px;font-size:94px;line-height:1.03;margin:0;font-weight:900;letter-spacing:-3px}
.sub{position:absolute;left:90px;right:100px;top:650px;font-size:38px;line-height:1.35;color:#b9c9d8}
.orbit{position:absolute;width:590px;height:590px;left:245px;top:900px;border:2px solid #2e7790;border-radius:50%;box-shadow:0 0 70px #0b8f9b33,inset 0 0 50px #0b8f9b22}
.orbit:before,.orbit:after{content:"";position:absolute;border:1px solid #2e7790;border-radius:50%;inset:50px}
.orbit:after{inset:115px}
.core{position:absolute;left:420px;top:1070px;width:240px;height:310px;border-radius:48% 48% 35% 35%;background:linear-gradient(135deg,#72e6c2,#168ca4 50%,#15517c);filter:drop-shadow(0 0 35px #42e0c566);clip-path:polygon(35% 0,65% 0,82% 14%,100% 34%,78% 53%,70% 100%,30% 100%,22% 53%,0 34%,18% 14%)}
.pulse{position:absolute;left:470px;top:1185px;width:140px;height:90px;border-radius:50%;background:#b4ffe7;filter:blur(45px);opacity:.5}
.caption{position:absolute;left:100px;right:100px;bottom:290px;text-align:center;font-size:52px;font-weight:800;line-height:1.2}
.footer{position:absolute;bottom:115px;left:90px;right:90px;display:flex;justify-content:space-between;color:#66869e;font-size:22px;letter-spacing:3px}
</style>
</head>
<body>
<div id="root" data-composition-id="fitfuel-hf-test" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
 <div class="grid"></div>
 <div class="brand clip" data-start="0" data-duration="8" data-track-index="1">FITFUEL / EXPLAINED</div>
 <div class="kicker clip" data-start="0.3" data-duration="7.4" data-track-index="2">TRAINING SCIENCE • 001</div>
 <h1 id="headline" class="clip" data-start="0.5" data-duration="7" data-track-index="3">MUSCLE<br>GROWTH IS<br>A SIGNAL.</h1>
 <p id="sub" class="sub clip" data-start="1.4" data-duration="6" data-track-index="4">Progressive overload gives your body a reason to adapt.</p>
 <div class="orbit clip" data-start="2" data-duration="5.5" data-track-index="5"></div>
 <div id="core" class="core clip" data-start="2" data-duration="5.5" data-track-index="6"></div>
 <div id="pulse" class="pulse clip" data-start="2" data-duration="5.5" data-track-index="7"></div>
 <div id="caption" class="caption clip" data-start="4" data-duration="3.5" data-track-index="8">Train. Recover. Repeat.</div>
 <div class="footer clip" data-start="0" data-duration="8" data-track-index="9"><span>SCIENCE • NOT SHORTCUTS</span><span>1080 × 1920</span></div>
 <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
 <script>
 const tl=gsap.timeline({paused:true});
 tl.from("#headline",{opacity:0,y:80,duration:.75,ease:"power3.out"},.5)
   .from("#sub",{opacity:0,y:35,duration:.6},1.4)
   .from(".orbit",{scale:.7,opacity:0,duration:1,ease:"back.out(1.4)"},2)
   .from("#core",{scale:.4,opacity:0,duration:.8,ease:"back.out(1.7)"},2.2)
   .from("#caption",{opacity:0,y:30,duration:.5},4);
 tl.to("#core",{scale:1.06,duration:1.2,repeat:2,yoyo:true,ease:"sine.inOut"},3);
 window.__timelines=window.__timelines||{};window.__timelines["fitfuel-hf-test"]=tl;
 </script>
</div>
</body>
</html>
