name: Blender 3D preview (safe, no upload)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'blender_3d_scenes.py'
      - 'blender_preview.py'
      - 'visual_scene_registry.py'
      - '.github/workflows/blender-preview.yml'

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libegl1 libegl-mesa0 libgl1-mesa-dri
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install Pillow
      - name: Render low-resolution Blender preview
        env:
          FITFUEL_PREVIEW_FAST: "1"
        run: python blender_preview.py --fixture --duration 2.5
      - name: Verify preview video
        run: |
          test -s output/3d_preview/preview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output/3d_preview/preview.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/3d_preview/preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: fitfuel-blender-3d-preview
          path: output/3d_preview/preview.mp4
          retention-days: 7
