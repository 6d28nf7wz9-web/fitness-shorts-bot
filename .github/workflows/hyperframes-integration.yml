name: HyperFrames production integration test

on:
  push:
    branches: [main, experiment/motion-skills-video-engine]
    paths:
      - 'hyperframes_render.py'
      - 'motion_director.py'
      - 'visual_engine.py'
      - 'avatar.py'
      - 'avatar_motion.py'
      - 'production_motion_engine.py'
      - 'tests/test_motion_director.py'
      - 'tests/test_visual_engine_scene_priority.py'
      - 'tests/test_avatar_motion_cues.py'
      - 'assemble.py'
      - 'blender/**'
      - '.github/workflows/hyperframes-integration.yml'
  pull_request:
    branches: [main, feature/scene-specific-science-visuals]
    paths:
      - 'hyperframes_render.py'
      - 'assemble.py'
      - '.github/workflows/hyperframes-integration.yml'
      - 'tests/test_hyperframes_render.py'
      - 'visual_engine.py'
      - 'avatar.py'
      - 'avatar_motion.py'
      - 'production_motion_engine.py'
      - 'tests/test_visual_engine_scene_priority.py'
      - 'tests/test_avatar_motion_cues.py'
      - 'blender/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FFmpeg and HyperFrames
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          npm install --global hyperframes@0.9.31
          hyperframes doctor
      - name: Create safe synthetic fixture (no YouTube upload)
        run: |
          mkdir -p output/clips output/audio
          python - <<'PY'
          import json, subprocess
          scenes = []
          audio = []
          for i in range(1, 5):
              subprocess.run(["ffmpeg","-y","-loglevel","error","-f","lavfi","-i",f"testsrc2=s=1080x1920:r=30:d=2","-an","-c:v","libx264","-pix_fmt","yuv420p",f"output/clips/scene_{i}.mp4"],check=True)
              voice=f"output/audio/voice_{i}.wav"
              subprocess.run(["ffmpeg","-y","-loglevel","error","-f","lavfi","-i","sine=frequency=440:duration=2","-c:a","pcm_s16le",voice],check=True)
              scenes.append({"narration":f"Test narration for scene {i} stays readable.","visual_title":f"TEST SCENE {i}","visual_subtitle":"SAFE TEXT LAYOUT"})
              audio.append({"scene":i,"seconds":2.0,"file":voice})
          json.dump({"title":"HyperFrames fixture","scenes":scenes},open("output/script.json","w"))
          json.dump(audio,open("output/audio_info.json","w"))
          PY
      - name: Render HyperFrames composition
        run: python hyperframes_render.py
      - name: Assemble final fixture with captions and audio
        run: python assemble.py
      - name: Verify output dimensions and duration
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output/final.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 output/final.mp4
          test -s output/final.mp4

  blender-science-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install headless render libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 ffmpeg
      - name: Install Blender 5.3
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://download.blender.org/release/Blender5.3/blender-5.3.0-linux-x64.tar.xz \
            -o /tmp/blender.tar.xz
          mkdir -p "$HOME/blender-5.3.0"
          tar -xJf /tmp/blender.tar.xz -C "$HOME/blender-5.3.0" --strip-components=1
          "$HOME/blender-5.3.0/blender" --version
      - name: Render 3D muscle-fiber animation
        run: |
          mkdir -p output
          "$HOME/blender-5.3.0/blender" -b --factory-startup --python-exit-code 1 \
            --python blender/fitfuel_science_preview.py -- \
            --output-dir output/blender-frames \
            --frames 96 --width 720 --height 1280 --title 'HOW MUSCLE FIBERS CONTRACT' --subtitle 'A closer look inside skeletal muscle'
          ffmpeg -y -hide_banner -loglevel error -framerate 24 \
            -i output/blender-frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            output/blender-science-preview.mp4
      - name: Validate 3D preview
        run: |
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames \
            -of json output/blender-science-preview.mp4
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 output/blender-science-preview.mp4
          test -s output/blender-science-preview.mp4
          python - <<'PY'
          import json, subprocess
          path = 'output/blender-science-preview.mp4'
          probe = subprocess.check_output([
              'ffprobe', '-v', 'error', '-select_streams', 'v:0',
              '-show_entries', 'stream=width,height,r_frame_rate,nb_frames',
              '-of', 'json', path
          ], text=True)
          stream = json.loads(probe)['streams'][0]
          assert (stream['width'], stream['height']) == (720, 1280), stream
          assert stream['r_frame_rate'] == '24/1', stream
          assert int(stream['nb_frames']) == 96, stream
          print('Portrait preview contract passed:', stream)
          PY
      - name: Upload 3D preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitfuel-blender-science-preview
          path: output/blender-science-preview.mp4
          if-no-files-found: error
          retention-days: 7
