name: FitFuel clean-room engine CI
on:
  pull_request:
    branches: [main]
    paths:
      - 'fitfuel_cleanroom.py'
      - 'tests/test_fitfuel_cleanroom.py'
      - '.github/workflows/cleanroom-engine-ci.yml'
  push:
    branches: [feat/fitfuel-clean-room-engine]
    paths:
      - 'fitfuel_cleanroom.py'
      - 'tests/test_fitfuel_cleanroom.py'
      - '.github/workflows/cleanroom-engine-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanroom-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only stock adapter dependency
        run: python -m pip install requests
      - name: Compile clean-room engine
        run: python -m py_compile fitfuel_cleanroom.py
      - name: Run clean-room contracts
        run: python -m unittest tests.test_fitfuel_cleanroom -v
