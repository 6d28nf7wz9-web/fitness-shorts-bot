name: ViMax FitFuel Preview

on:
  push:
    branches:
      - experiment/vimax-standalone-evaluation
    paths:
      - "experiments/vimax/**"
      - ".github/workflows/vimax-fitfuel-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vimax-fitfuel-preview
  cancel-in-progress: true

jobs:
  render-preview:
    if: ${{ vars.VIMAX_PAID_RENDER == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check required API credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || { echo "::error::Missing repository secret GEMINI_API_KEY"; exit 1; }

      - name: Check out FitFuel experiment
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Clone and install ViMax in an isolated directory
        run: |
          git clone --depth 1 https://github.com/HKUDS/ViMax.git ViMax
          cd ViMax
          uv sync --no-dev --no-install-project
          # Keep this evaluation portrait and use the lower-cost current Google media models.
          python - <<'PY'
          from pathlib import Path

          image_path = Path("tools/image_generator_nanobanana_google_api.py")
          image_source = image_path.read_text(encoding="utf-8")
          image_replacements = {
              'self.model = "gemini-2.5-flash-image"': 'self.model = "gemini-3.1-flash-image"',
              'aspect_ratio: Optional[str] = "16:9"': 'aspect_ratio: Optional[str] = "9:16"',
              'if e.status_code == 429': 'if e.code == 429',
          }
          for old, new in image_replacements.items():
              if old not in image_source:
                  raise SystemExit(f"Could not safely patch image adapter: missing {old}")
              image_source = image_source.replace(old, new, 1)
          image_path.write_text(image_source, encoding="utf-8")

          video_path = Path("tools/video_generator_veo_google_api.py")
          video_source = video_path.read_text(encoding="utf-8")
          video_replacements = {
              't2v_model: str = "veo-3.1-generate-preview"': 't2v_model: str = "veo-3.1-fast-generate-preview"',
              'ff2v_model: str = "veo-3.1-generate-preview"': 'ff2v_model: str = "veo-3.1-fast-generate-preview"',
              'flf2v_model: str = "veo-3.1-generate-preview"': 'flf2v_model: str = "veo-3.1-fast-generate-preview"',
              'resolution: str = "1080p"': 'resolution: str = "720p"',
              'aspect_ratio: str = "16:9"': 'aspect_ratio: str = "9:16"',
          }
          for old, new in video_replacements.items():
              if old not in video_source:
                  raise SystemExit(f"Could not safely patch video adapter: missing {old}")
              video_source = video_source.replace(old, new, 1)
          video_path.write_text(video_source, encoding="utf-8")
          PY

      - name: Prepare FitFuel script and run ViMax
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cp experiments/vimax/test_script.txt ViMax/fitfuel_test_script.txt
          cp experiments/vimax/run_vimax.py ViMax/run_fitfuel_vimax.py
          cd ViMax
          uv run --no-sync python run_fitfuel_vimax.py

      - name: Upload preview and storyboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FitFuel-ViMax-preview
          path: |
            ViMax/artifacts/FitFuel_ViMax_preview.mp4
            ViMax/.working_dir/fitfuel_eval/storyboard.json
            ViMax/.working_dir/fitfuel_eval/shots/*/first_frame.png
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: true
