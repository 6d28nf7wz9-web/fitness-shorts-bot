name: Build Long Video

on:
  push:
    paths:
      - "recordings/**"
  workflow_dispatch:
    inputs:
      long_id:
        description: "Script ID to build, like L001. Leave empty for the next one waiting."
        required: false

permissions:
  contents: write

concurrency:
  group: build-long
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      UPLOAD_PRIVACY: private
      LONG_ID: ${{ github.event.inputs.long_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Transcribe recording
        run: python long_transcribe.py

      - name: Build and upload
        run: |
          if [ ! -f output/long/job.json ]; then
            echo "Nothing to build."
            exit 0
          fi
          python long_clips.py
          python long_assemble.py
          python long_upload.py

      - name: Save status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue
          git diff --staged --quiet || git commit -m "Mark long video uploaded"
          git pull --rebase
          git push

      - name: Keep video if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-long-video
          path: output/long/final_long.mp4
          retention-days: 2
          if-no-files-found: ignore