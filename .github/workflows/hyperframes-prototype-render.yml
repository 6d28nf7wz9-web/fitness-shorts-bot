name: HyperFrames prototype render
on:
  push:
    branches:
      - experiment/hyperframes-video-prototype
    paths:
      - 'hyperframes-prototype/**'
      - '.github/workflows/hyperframes-prototype-render.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check environment
        run: npx --yes hyperframes doctor
      - name: Lint composition
        working-directory: hyperframes-prototype
        run: npx --yes hyperframes lint
      - name: Render MP4
        working-directory: hyperframes-prototype
        run: npx --yes hyperframes render --output hyperframes-test.mp4 --fps 30
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-prototype-mp4
          path: hyperframes-prototype/hyperframes-test.mp4
          if-no-files-found: error
          retention-days: 7
