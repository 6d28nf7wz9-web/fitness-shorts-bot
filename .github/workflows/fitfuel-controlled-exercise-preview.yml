name: FitFuel controlled exercise preview

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Biceps curl preview duration in seconds"
        required: true
        default: "5"
        type: string
      fast_preview:
        description: "Use low-resolution quick preview"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated exercise-rig branch
        uses: actions/checkout@v4
        with:
          ref: feat/fitfuel-controlled-exercise-rig
      - name: Install pinned Blender 4.2.0 LTS and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xz-utils curl libegl1 libgl1 libgles2 libxrender1 libxi6 libxkbcommon0 libsm6
          BLENDER_VERSION="4.2.0"
          curl -fL "https://download.blender.org/release/Blender4.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf "$RUNNER_TEMP/blender.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/blender"
          echo "$RUNNER_TEMP/blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/blender/blender" --background --factory-startup --python-expr "import bpy; print('FITFUEL_BLENDER_VERSION', bpy.app.version_string)"
          ffmpeg -version | head -n 1
      - name: Check Python syntax
        run: |
          python -m py_compile blender_preview.py blender_bicep_curl.py blender_3d_scenes.py
      - name: Run scene-routing tests
        run: |
          python -m unittest discover -s tests -p "test_blender_preview.py" -v
      - name: Render five-second controlled biceps curl
        env:
          FITFUEL_PREVIEW_FAST: ${{ inputs.fast_preview && '1' || '0' }}
        run: |
          python blender_preview.py --fixture --biceps-curl-only --duration "${{ inputs.duration }}"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,nb_frames -of json output/3d_preview/preview.mp4
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitfuel-controlled-exercise-preview
          path: output/3d_preview/preview.mp4
          if-no-files-found: error
          retention-days: 7
