name: Daily Short

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-short
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      UPLOAD_PRIVACY: public
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug checked-out version
        run: |
          echo "========== GITHUB RUN INFO =========="
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          git log -1 --oneline

          echo "========== CLIPS_FAST.PY =========="
          grep -n "scenes =" clips_fast.py || true
          grep -n "enumerate(scenes" clips_fast.py || true

          echo "========== FILE CONTENT =========="
          nl -ba clips_fast.py | sed -n '1,125p'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Write script
        run: python gen_script.py

      - name: Voiceover
        run: python voice.py

      - name: Fetch clips
        run: python clips_fast.py

      - name: Assemble video
        run: |
          python assemble.py
          python avatar.py short

      - name: Upload to YouTube
        run: python upload.py

      - name: Save learning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.json performance_memory.json
          git add -f output/uploaded_videos.json

          git diff --staged --quiet || git commit -m "Save video history and performance memory"

          git pull --rebase
          git push

      - name: Keep video if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-video
          path: output/final.mp4
          retention-days: 2
          if-no-files-found: ignore
