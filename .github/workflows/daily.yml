name: Daily Short

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      preview_only:
        description: "Build and save a preview artifact without uploading to YouTube"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fitness-video-pipelines
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      NASA_VIDEO_SEARCH: "1"
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      UPLOAD_PRIVACY: public
      SKIP_UPLOAD: ${{ inputs.preview_only && '1' || '' }}
      HYPERFRAMES_RENDER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install HyperFrames CLI
        run: |
          npm install --global hyperframes@0.9.31
          hyperframes doctor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Write script
        run: python gen_script.py

      - name: Voiceover
        run: python voice.py

      - name: Fetch relevant free stock footage (Pixabay + Coverr + Pexels + NASA + local Mixkit/Videvo)
        env:
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          WAN_API_KEY: ${{ secrets.WAN_API_KEY }}
          I2V_ENABLED: ${{ vars.I2V_ENABLED || '0' }}
          I2V_PROVIDER: ${{ vars.I2V_PROVIDER || 'kling' }}
          I2V_MAX_SCENES: ${{ vars.I2V_MAX_SCENES || '2' }}
        run: python clips_fast.py

      - name: Validate script and footage
        run: python quality_check.py

      - name: Assemble video
        run: |
          python assemble.py
          python avatar.py short

      - name: Upload to YouTube (skipped in preview-only mode)
        run: python upload.py

      - name: Save preview video artifact
        if: ${{ inputs.preview_only }}
        uses: actions/upload-artifact@v4
        with:
          name: fitfuel-short-preview
          path: output/final.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Save learning data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.json performance_memory.json
          git add -f output/uploaded_videos.json

          git diff --staged --quiet || git commit -m "Save video history and performance memory"

          git pull --rebase
          git push

      - name: Keep video if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-video
          path: output/final.mp4
          retention-days: 2
          if-no-files-found: ignore
