name: Daily Short

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 11 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fitness-video-pipelines
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      UPLOAD_PRIVACY: public
      SCIENCE_VISUALS: '1'
      VISUAL_ENGINE: blender3d
      CGI_RELEASE_APPROVED: 'false'
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug checked-out version
        run: |
          echo "========== GITHUB RUN INFO =========="
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          git log -1 --oneline

          echo "========== CLIPS_FAST.PY =========="
          grep -n "scenes =" clips_fast.py || true
          grep -n "enumerate(scenes" clips_fast.py || true

          echo "========== FILE CONTENT =========="
          nl -ba clips_fast.py | sed -n '1,125p'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core blender libegl1 libgl1 libxrender1 libxi6 libxxf86vm1 libxfixes3 libxkbcommon0

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Write script
        run: python gen_script.py

      - name: Voiceover
        run: python voice.py

      - name: Fetch clips
        run: |
          echo "========== DEBUG INFO =========="
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Working directory:"
          pwd
          echo "========== ACTUAL FILE =========="
          ls -l clips_fast.py
          sha256sum clips_fast.py
          echo "========== SCENES DEFINITION =========="
          grep -n "scenes =" clips_fast.py || true
          echo "========== LOOP LOCATION =========="
          grep -n "enumerate(scenes" clips_fast.py || true
          echo "========== RUN SCRIPT =========="
          python clips_fast.py

      - name: Validate script and footage
        run: python quality_check.py

      - name: Test scientific visual mapping
        run: python -m unittest discover -s tests -v

      - name: Render topic-specific 3D CGI scenes
        run: python science_visuals.py

      - name: Assemble video
        run: |
          python assemble.py
          python avatar.py short

      - name: Upload to YouTube
        if: env.CGI_RELEASE_APPROVED == 'true'
        run: python upload.py

      - name: Hold publication until reference-quality CGI is approved
        if: env.CGI_RELEASE_APPROVED != 'true'
        run: echo '3D CGI render completed; publication held pending visual quality approval.'

      - name: Save learning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add used_topics.json performance_memory.json
          git add -f output/uploaded_videos.json

          git diff --staged --quiet || git commit -m "Save video history and performance memory"

          git pull --rebase
          git push

      - name: Keep video if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-run-video
          path: output/final.mp4
          retention-days: 2
          if-no-files-found: ignore
