name: Blender controlled exercise preview

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Duration per scene in seconds"
        required: true
        default: "5"
        type: string
      fast_preview:
        description: "Use low-resolution quick preview"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  render-preview:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated exercise-rig branch
        uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg
          blender --version
          ffmpeg -version | head -n 1
      - name: Check Python syntax
        run: |
          python -m py_compile blender_preview.py blender_bicep_curl.py blender_3d_scenes.py
      - name: Run scene-routing tests
        run: |
          python -m unittest discover -s tests -p "test_blender_preview.py" -v
      - name: Render controlled FitFuel exercise preview
        env:
          FITFUEL_PREVIEW_FAST: ${{ inputs.fast_preview && '1' || '0' }}
        run: |
          python blender_preview.py --fixture --biceps-curl-only --duration "${{ inputs.duration }}"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height,nb_frames -of json output/3d_preview/preview.mp4
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fitfuel-controlled-exercise-preview
          path: output/3d_preview/preview.mp4
          if-no-files-found: error
          retention-days: 7
