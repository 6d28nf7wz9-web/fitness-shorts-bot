name: YouTube Analytics Sync

on:
  schedule:
    - cron: "35 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fitness-video-pipelines
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      ANALYTICS_WINDOW_DAYS: "28"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build local growth report (works with last saved analytics)
        run: python growth_report.py
      - name: Sync video analytics
        run: python analytics_sync.py
      - name: Build monetization progress report
        run: python monetization_report.py
      - name: Upload growth report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitfuel-growth-report
          path: output/growth_report.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit learning data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add performance_memory.json output/monetization_progress.json
          git diff --staged --quiet || git commit -m "Update YouTube Analytics learning data"
          git pull --rebase
          git push
