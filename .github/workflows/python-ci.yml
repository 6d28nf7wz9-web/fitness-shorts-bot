name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install visual test dependency
        run: pip install Pillow
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Test scientific visual selection
        run: python -m unittest discover -s tests -p "test_science_visuals.py" -v
