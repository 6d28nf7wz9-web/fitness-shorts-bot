name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Validate schedules and YouTube upload quota
        run: python check_setup.py
      - name: Test series-level analytics learning
        run: |
          pip install google-api-python-client google-auth
          python -m unittest discover -s tests -p "test_growth_analytics.py" -v
