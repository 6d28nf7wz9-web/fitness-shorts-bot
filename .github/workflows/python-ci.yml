name: Python CI

on:
  push:
    branches: [main, experiment/motion-skills-video-engine]
  pull_request:
    branches: [main, feature/scene-specific-science-visuals]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Validate schedules and YouTube upload quota
        run: python check_setup.py
      - name: Test bounded Gemini script generation
        run: |
          python -m pip install google-genai
          python -m unittest discover -s tests -p "test_gen_script_timeout.py" -v
          python -m unittest discover -s tests -p "test_gen_script_quota.py" -v
      - name: Test Shorts metadata packaging validation
        run: python -m unittest discover -s tests -p "test_packaging_validation.py" -v
      - name: Test free multi-provider AI failover
        run: |
          python -m pip install requests google-genai
          python -m unittest discover -s tests -p "test_ai_providers.py" -v
      - name: Test recurring Shorts series and episode sequencing
        run: python -m unittest discover -s tests -p "test_series_engine.py" -v
      - name: Test HyperFrames typography layout
        run: python -m unittest discover -s tests -p "test_hyperframes_render.py" -v
      - name: Test Motion Skills scene direction
        run: python -m unittest discover -s tests -p "test_motion_director.py" -v
      - name: Test synchronized production motion engine
        run: python -m unittest discover -s tests -p "test_production_motion_engine.py" -v
      - name: Test spoken-action B-roll targeting and continuous visual motion
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p "test_clips_fast_targets.py" -v
          python -m unittest discover -s tests -p "test_continuous_visual_motion.py" -v
          python -m unittest discover -s tests -p "test_avatar_motion_cues.py" -v
      - name: Test image-to-video adapters (mocked; no provider calls)
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p "test_image_to_video.py" -v
          python -m unittest discover -s tests -p "test_wan_stock_assist.py" -v
      - name: Test scene-aware clip matching and pre-upload relevance gate
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p "test_clip_relevance.py" -v
          python -m unittest discover -s tests -p "test_sentence_contexts.py" -v
      - name: Test offline growth report
        run: python -m unittest discover -s tests -p "test_growth_report.py" -v
      - name: Test analytics-driven topic and hook intelligence
        run: python -m unittest discover -s tests -p "test_topic_intelligence.py" -v
      - name: Test series-level analytics learning
        run: |
          pip install google-api-python-client google-auth
          python -m unittest discover -s tests -p "test_growth_analytics.py" -v
      - name: Smoke-test Coverr API and MP4 URLs
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p "test_coverr_api.py" -v
      - name: Test presenter safe-zone and long-video Coverr integration
        run: python -m unittest discover -s tests -p "test_avatar_coverr_long.py" -v
