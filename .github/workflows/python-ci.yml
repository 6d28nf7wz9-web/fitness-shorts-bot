name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install visual test and rendering dependencies
        run: |
          pip install Pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Validate schedules and YouTube upload quota
        run: python check_setup.py
      - name: Test scientific visual selection
        run: python -m unittest discover -s tests -p "test_science_visuals.py" -v
      - name: Render scientific animation preview
        run: python preview_science_visuals.py
      - name: Upload preview video
        uses: actions/upload-artifact@v4
        with:
          name: science-visuals-preview
          path: output/science_preview.mp4
          if-no-files-found: error
          retention-days: 7
