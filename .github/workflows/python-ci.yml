name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Validate schedules and YouTube upload quota
        run: python check_setup.py
      - name: Test bounded Gemini script generation
        run: |
          python -m pip install google-genai
          python -m unittest discover -s tests -p "test_gen_script_timeout.py" -v
          python -m unittest discover -s tests -p "test_gen_script_quota.py" -v
      - name: Test recurring Shorts series and episode sequencing
        run: python -m unittest discover -s tests -p "test_series_engine.py" -v
      - name: Test HyperFrames typography layout
        run: python -m unittest discover -s tests -p "test_hyperframes_render.py" -v
      - name: Test image-to-video adapters (mocked; no provider calls)
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p "test_image_to_video.py" -v
          python -m unittest discover -s tests -p "test_wan_stock_assist.py" -v
      - name: Test scene-aware clip matching and pre-upload relevance gate
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p "test_clip_relevance.py" -v
      - name: Test series-level analytics learning
        run: |
          pip install google-api-python-client google-auth
          python -m unittest discover -s tests -p "test_growth_analytics.py" -v
      - name: Smoke-test Coverr API and MP4 URLs
        env:
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: |
          python -m pip install requests
          python -m unittest discover -s tests -p "test_coverr_api.py" -v
      - name: Test presenter safe-zone and long-video Coverr integration
        run: python -m unittest discover -s tests -p "test_avatar_coverr_long.py" -v
