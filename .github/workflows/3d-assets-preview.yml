name: 3D Asset Preview
on:
  pull_request:
    paths:
      - "asset_pipeline.py"
      - "blender_asset_preview.py"
      - "asset_generation/**"
      - "tests/test_asset_pipeline.py"
      - ".github/workflows/3d-assets-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-3d-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg python3-numpy libegl1 libgl1
      - name: Test asset catalog and safe routing
        run: python -m unittest discover -s tests -p "test_asset_pipeline.py" -v
      - name: Render animated anatomy scene
        run: PYTHONPATH=/usr/lib/python3/dist-packages LIBGL_ALWAYS_SOFTWARE=1 blender -b --python blender_asset_preview.py
      - name: Validate portrait preview and exports
        shell: bash
        run: |
          set -euo pipefail
          test -s output/3d_preview/preview.mp4
          test -s output/3d_preview/preview.blend
          test -s output/3d_preview/scene_asset_plan.json
          test -s output/3d_preview/narration_sync.json
          test -s assets_3d/generated/biceps_anatomy_preview.glb
          duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 output/3d_preview/preview.mp4)"
          dimensions="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 output/3d_preview/preview.mp4)"
          fps="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 output/3d_preview/preview.mp4)"
          echo "Preview duration: $duration seconds"
          echo "Preview dimensions: $dimensions"
          echo "Preview frame rate: $fps"
          test "$dimensions" = "1080x1920"
          test "$fps" = "24/1"
          python - "$duration" <<'PY'
          import json, subprocess, sys
          duration=float(sys.argv[1])
          with open("output/3d_preview/narration_sync.json", encoding="utf-8") as f:
              sync=json.load(f)
          expected=float(sync["duration"])
          assert abs(duration-expected) <= 1.0, f"Video duration {duration} does not match cue timeline {expected}"
          probe=subprocess.run(["ffprobe","-v","error","-show_entries","stream=codec_type","-of","json","output/3d_preview/preview.mp4"],capture_output=True,text=True,check=True)
          streams=json.loads(probe.stdout).get("streams",[])
          has_audio=any(x.get("codec_type")=="audio" for x in streams)
          assert has_audio == bool(sync.get("audio_attached")), f"Audio stream mismatch: metadata={sync.get('audio_attached')} stream={has_audio}"
          assert expected >= 7.5, f"Preview unexpectedly short: {expected}"
          PY
      - name: Upload preview, sync map and asset pack
        uses: actions/upload-artifact@v4
        with:
          name: fitfuel-anatomy-1080x1920-preview
          path: |
            output/3d_preview/preview.mp4
            output/3d_preview/preview.blend
            output/3d_preview/scene_asset_plan.json
            output/3d_preview/narration_sync.json
            assets_3d/catalog.json
            assets_3d/generated/*.glb
          retention-days: 14
