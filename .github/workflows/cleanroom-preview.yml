name: FitFuel clean-room preview

on:
  push:
    branches: [feat/fitfuel-clean-room-engine]
    paths:
      - 'fitfuel_cleanroom.py'
      - '.github/workflows/cleanroom-preview.yml'
      - 'gen_script.py'
      - 'voice.py'
      - 'clips.py'
      - 'stock_sources.py'
      - 'tools/render_open_anatomy.py'
      - 'tools/fitfuel_visual_adapters.py'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: fitfuel-cleanroom-preview
  cancel-in-progress: false

jobs:
  render-preview:
    needs: medical-cgi-proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
      OPENROUTER_MODEL: openrouter/free
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      NASA_VIDEO_SEARCH: "1"
      I2V_ENABLED: "0"
      WAN_STOCK_ASSIST: "0"
      CLEANROOM_MIN_RELEVANCE: "0.34"
      TTS_VOICE: en-US-AndrewNeural
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Download validated anatomy CGI from proof job
        uses: actions/download-artifact@v4
        with:
          name: fitfuel-open-anatomy-cgi-proof
          path: output/cleanroom/repo_visuals/open-anatomy
      - name: Generate a fresh script
        run: python gen_script.py
      - name: Generate scene voiceovers
        run: python voice.py
      - name: Build with the clean-room engine only
        run: python fitfuel_cleanroom.py
      - name: Verify MP4 streams and duration
        run: |
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration,size -of json output/cleanroom/final.mp4 | tee output/cleanroom/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("output/cleanroom/ffprobe.json").read_text())
          streams=p.get("streams",[])
          assert any(s.get("codec_type")=="video" and s.get("width")==1080 and s.get("height")==1920 for s in streams), streams
          assert any(s.get("codec_type")=="audio" for s in streams), streams
          assert float(p["format"]["duration"]) > 1, p
          assert int(p["format"]["size"]) > 100000, p
          print("MP4 validation passed:", p["format"])
          PY
      - name: Upload clean-room preview and evidence
        uses: actions/upload-artifact@v4
        with:
          name: fitfuel-cleanroom-preview
          path: |
            output/cleanroom/final.mp4
            output/cleanroom/storyboard.json
            output/cleanroom/footage_manifest.json
            output/cleanroom/review.json
            output/cleanroom/ffprobe.json
          retention-days: 7
          if-no-files-found: error

  medical-cgi-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fitfuel-clean-room-engine
      - name: Install Blender runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libx11-6 libxi6 libxrender1 libxxf86vm1 libxfixes3 libxkbcommon0 libsm6 libglib2.0-0 libegl1 libgl1
      - name: Install Blender 5.2.5
        run: |
          curl -L --fail --retry 3 https://mirror.blender.org/release/Blender5.2/blender-5.2.5-linux-x64.tar.xz -o /tmp/blender.tar.xz
          mkdir -p "$HOME/blender"
          tar -xJf /tmp/blender.tar.xz -C "$HOME/blender" --strip-components=1
          echo "$HOME/blender" >> "$GITHUB_PATH"
          "$HOME/blender/blender" --background --factory-startup --python-expr "import bpy; print(bpy.app.version_string)"
      - name: Download open anatomy GLB and attribution
        run: |
          mkdir -p /tmp/anatomy-package /tmp/fitfuel-cgi
          curl -L --fail --retry 3 https://cdn.jsdelivr.net/npm/open-anatomy-3d@0.1.0/models/anatomy-male.glb -o /tmp/anatomy-package/model.glb
          test "$(stat -c%s /tmp/anatomy-package/model.glb)" -gt 1000000
          curl -L --fail https://cdn.jsdelivr.net/npm/open-anatomy-3d@0.1.0/ATTRIBUTION.md -o /tmp/anatomy-package/ATTRIBUTION.md
      - name: Render anatomy with cinematic lighting and camera motion
        env:
          ANATOMY_GLB: /tmp/anatomy-package/model.glb
          CGI_OUT: /tmp/fitfuel-cgi
        run: |
          blender --background --factory-startup --python tools/render_open_anatomy.py
          test -s /tmp/fitfuel-cgi/anatomy-muscle-hero.png
          ffmpeg -y -loglevel error -framerate 24 -i /tmp/fitfuel-cgi/frame_%04d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart /tmp/fitfuel-cgi/anatomy-muscle-cinematic.mp4
          test -s /tmp/fitfuel-cgi/anatomy-muscle-cinematic.mp4
          ffprobe -v error -show_entries stream=codec_type,width,height -show_entries format=duration,size -of json /tmp/fitfuel-cgi/anatomy-muscle-cinematic.mp4 > /tmp/fitfuel-cgi/ffprobe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/fitfuel-cgi/ffprobe.json").read_text())
          v=next(x for x in p["streams"] if x["codec_type"]=="video")
          assert (v["width"],v["height"])==(720,1280),v
          assert float(p["format"]["duration"])>=2,p
          print("CGI proof validated:",p["format"])
          PY
      - name: Create contact sheet
        run: ffmpeg -y -i /tmp/fitfuel-cgi/anatomy-muscle-cinematic.mp4 -vf "select='eq(n,0)+eq(n,18)+eq(n,36)+eq(n,54)+eq(n,71)',scale=216:384,tile=5x1" -frames:v 1 /tmp/fitfuel-cgi/contact.png
      - uses: actions/upload-artifact@v4
        with:
          name: fitfuel-open-anatomy-cgi-proof
          path: |
            /tmp/fitfuel-cgi/anatomy-muscle-cinematic.mp4
            /tmp/fitfuel-cgi/anatomy-muscle-hero.png
            /tmp/fitfuel-cgi/contact.png
            /tmp/fitfuel-cgi/ffprobe.json
            /tmp/fitfuel-cgi/model_inventory.txt
            /tmp/fitfuel-cgi/render_mode.txt
            /tmp/anatomy-package/ATTRIBUTION.md
          retention-days: 7
          if-no-files-found: error
