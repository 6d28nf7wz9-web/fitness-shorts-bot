<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitFuel · SVG + WebGL muscle mechanics</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#071522;color:#eaf7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 15%,#17405a,#0b2234 48%,#06111d)}.card{width:min(760px,100%);border:1px solid #31556a;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#102b3d,#091a29);box-shadow:0 28px 90px #0008}header{text-align:center;padding:24px 20px 8px}h1{font-size:clamp(22px,4vw,32px);letter-spacing:.12em;margin:0}header p{color:#9bbbc9;font-size:12px;letter-spacing:.18em}.stage{position:relative;width:100%;aspect-ratio:4/3}svg,canvas{position:absolute;inset:0;width:100%;height:100%}canvas{pointer-events:none}footer{text-align:center;padding:12px 20px 22px;color:#9bbbc9;font-size:13px}.caption{color:#6fd8e9}button{border:1px solid #3f8199;background:#12374a;color:#eaf7fb;padding:10px 18px;border-radius:999px;font-weight:650}.fallback{opacity:.85}.gl-on .fallback{opacity:.22}
</style></head><body><main class="card" id="card"><header><h1>MUSCLE FORCE</h1><p>BICEPS · CONTRACTION &amp; TENSION</p></header><div class="stage">
<svg viewBox="0 0 760 570" role="img" aria-label="Schematic biceps muscle, tendon and articulated elbow">
<defs><linearGradient id="bone" x2="1"><stop stop-color="#9e9c87"/><stop offset=".5" stop-color="#f3e8c8"/><stop offset="1" stop-color="#aaa58f"/></linearGradient><linearGradient id="muscle" x2="1"><stop stop-color="#781b32"/><stop offset=".48" stop-color="#f05a72"/><stop offset="1" stop-color="#8f1c37"/></linearGradient><radialGradient id="joint"><stop stop-color="#b6ffff"/><stop offset=".55" stop-color="#37bfc9"/><stop offset="1" stop-color="#126b83"/></radialGradient></defs>
<g class="fallback" stroke-linecap="round" stroke-linejoin="round"><path d="M355 95L355 445" stroke="url(#bone)" stroke-width="28"/><path d="M342 435L300 515M368 435L400 515" stroke="url(#bone)" stroke-width="19"/><path d="M355 140C275 160 275 340 355 382C435 340 435 160 355 140Z" fill="url(#muscle)" stroke="#ff9aaa" stroke-width="3"/><g stroke="#ffb3bf" stroke-width="4" opacity=".8"><path d="M320 168Q300 265 338 355"/><path d="M340 153Q326 260 350 370"/><path d="M365 153Q390 260 360 370"/><path d="M390 168Q410 265 372 355"/></g><path d="M355 95L355 143M355 380L355 442" stroke="#f4d7b0" stroke-width="17"/><circle cx="355" cy="95" r="38" fill="url(#joint)" stroke="#8cf4f4" stroke-width="3"/><circle cx="355" cy="445" r="38" fill="url(#joint)" stroke="#8cf4f4" stroke-width="3"/><g fill="#dffaff" font-size="14" letter-spacing="1"><text x="65" y="105">SHOULDER JOINT</text><text x="520" y="185">MUSCLE BELLY</text><text x="520" y="430">ELBOW JOINT</text></g><g fill="none" stroke="#74c6d6" stroke-width="2"><path d="M185 100H285L315 95"/><path d="M510 190H455L415 230"/><path d="M510 425H435L390 445"/></g></g></svg><canvas id="fx" aria-hidden="true"></canvas></div><footer><p class="caption">SVG defines every solid · WebGL adds the contraction field</p><button id="toggle">Pause animation</button></footer></main>
<script>
(()=>{const canvas=document.getElementById('fx'),card=document.getElementById('card'),gl=canvas.getContext('webgl',{alpha:true,antialias:true});if(!gl)return;
const vs='attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const fs='precision mediump float;varying vec2 uv;uniform float t;void main(){vec2 q=uv-vec2(.5,.49);float wave=sin(t*2.1-q.y*18.)*.5+.5;float muscle=exp(-pow(q.x*2.5,2.)-pow((q.y+.01)*3.2,2.));float pulse=exp(-pow((length(q-vec2(0.,-.02))-(.13+.025*sin(t*2.1)))*30.,2.));float a=(.12*wave*muscle+.18*pulse*muscle);vec3 c=mix(vec3(.03,.48,.62),vec3(.25,.95,1.),wave);gl_FragColor=vec4(c,a);}';
function makeShader(type,src){const sh=gl.createShader(type);gl.shaderSource(sh,src);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}
const program=gl.createProgram();gl.attachShader(program,makeShader(gl.VERTEX_SHADER,vs));gl.attachShader(program,makeShader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))return;gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const time=gl.getUniformLocation(program,'t');let paused=false,start=performance.now();
function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);gl.viewport(0,0,canvas.width,canvas.height)}new ResizeObserver(resize).observe(canvas);resize();
function frame(now){if(!paused){gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(time,(now-start)/1000);gl.drawArrays(gl.TRIANGLE_STRIP,0,4)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.getElementById('toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume animation':'Pause animation'};card.classList.add('gl-on')})();
</script></body></html>
